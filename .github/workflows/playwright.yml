name: SAM Playwright Tests — Staging

on:
  push:
    branches: [ staging ]   # Runs when staging is updated
  workflow_dispatch:        # Allows manual trigger from GitHub UI
  schedule:
    - cron: '0 2 * * *'     # Nightly run at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5️⃣ Run tests on staging
      - name: Run Playwright tests (staging)
        run: ENV=staging npx playwright test
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}

      # 6️⃣ Upload HTML report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
