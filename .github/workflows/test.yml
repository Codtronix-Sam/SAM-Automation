name: Run Playwright Test Daily

on:
  schedule:
    - cron: '0 3 * * *'   # 8 AM PKT
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: staging
      ROLE: superadmin
      HEADLESS: true
      BASE_URL: ${{ secrets.BASE_URL }}
      SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
      SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 🔑 Login
      - name: Setup Auth
        run: node auth/setupAuth.js

      # 🧪 Run test
      - name: Run Playwright Test
        run: npx playwright test tests/payments.spec.js -g "Verify bulk update invoices to Unpaid"

      # 🔥 Install Allure CLI
      - name: Install Allure
        run: npm install -g allure-commandline

      # 📊 Generate Allure Report
      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report

      # 📦 Upload report as artifact
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report